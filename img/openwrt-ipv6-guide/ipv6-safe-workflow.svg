<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="OpenWrt IPv6 safe workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#12324a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <text x="70" y="82" fill="#f8fafc" font-size="38" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">推荐工作流：LAN 不发 IPv6，软路由自己用 IPv6 连 VPS</text>
  <text x="70" y="126" fill="#b6e3f2" font-size="22" font-family="Arial, 'PingFang SC', sans-serif">终端防直出，代理核心仍然可以走 VPS IPv6 节点</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="300" height="270" rx="20" fill="#f8fafc"/>
    <text x="100" y="245" fill="#0f172a" font-size="30" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">电脑 / 手机</text>
    <text x="100" y="298" fill="#334155" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">只拿 LAN IPv4</text>
    <text x="100" y="344" fill="#334155" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">不拿公网 IPv6</text>
    <rect x="100" y="382" width="226" height="42" rx="21" fill="#dcfce7"/>
    <text x="126" y="410" fill="#166534" font-size="22" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">降低 IPv6 泄漏</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="168" width="330" height="314" rx="22" fill="#e0f2fe"/>
    <text x="585" y="225" fill="#0f172a" font-size="30" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">OpenWrt / iStoreOS</text>
    <text x="585" y="278" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">WAN6 保留 IPv6</text>
    <text x="585" y="323" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">LAN RA / DHCPv6 关闭</text>
    <text x="585" y="368" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">DNS 交给代理核心</text>
    <rect x="585" y="407" width="250" height="42" rx="21" fill="#bae6fd"/>
    <text x="614" y="435" fill="#075985" font-size="22" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">HomeProxy / OpenClash</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1055" y="190" width="275" height="270" rx="20" fill="#fef3c7"/>
    <text x="1090" y="245" fill="#0f172a" font-size="30" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">VPS IPv6 节点</text>
    <text x="1090" y="298" fill="#334155" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">VLESS + Reality</text>
    <text x="1090" y="344" fill="#334155" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">Vision / 443</text>
    <rect x="1090" y="382" width="202" height="42" rx="21" fill="#fed7aa"/>
    <text x="1124" y="410" fill="#9a3412" font-size="22" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">IPv6 出站链路</text>
  </g>

  <path d="M390 326 C450 326 488 326 530 326" stroke="#38bdf8" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <text x="412" y="300" fill="#e0f2fe" font-size="22" font-family="Arial, 'PingFang SC', sans-serif">IPv4 / LAN</text>
  <path d="M900 326 C960 326 1000 326 1035 326" stroke="#38bdf8" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <text x="930" y="300" fill="#e0f2fe" font-size="22" font-family="Arial, 'PingFang SC', sans-serif">IPv6 到 VPS</text>

  <rect x="70" y="555" width="1260" height="94" rx="18" fill="#0f172a" opacity="0.72"/>
  <text x="100" y="595" fill="#f8fafc" font-size="24" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">关键判断</text>
  <text x="100" y="632" fill="#cbd5e1" font-size="22" font-family="Arial, 'PingFang SC', sans-serif">LAN 侧禁 IPv6，不等于软路由禁 IPv6；只要 WAN6 能 ping 通 VPS IPv6，就可以创建 IPv6 节点。</text>
</svg>

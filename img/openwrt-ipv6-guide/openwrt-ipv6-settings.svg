<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="OpenWrt IPv6 settings checklist">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dff7f3"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="34" fill="url(#bg2)"/>
  <text x="70" y="82" fill="#0f172a" font-size="38" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">OpenWrt / iStoreOS 设置总览</text>
  <text x="70" y="126" fill="#475569" font-size="22" font-family="Arial, 'PingFang SC', sans-serif">目标：软路由使用 IPv6，LAN 终端不直接拿公网 IPv6</text>

  <g filter="url(#shadow2)">
    <rect x="70" y="180" width="386" height="480" rx="22" fill="#ffffff"/>
    <rect x="70" y="180" width="386" height="78" rx="22" fill="#0f766e"/>
    <text x="105" y="230" fill="#ffffff" font-size="29" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">WAN6：负责拿 IPv6</text>
    <text x="105" y="310" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">协议：DHCPv6 客户端</text>
    <text x="105" y="360" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">默认网关：勾选</text>
    <text x="105" y="410" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">IPv6 源路由：勾选</text>
    <text x="105" y="460" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">委派 IPv6 前缀：勾选</text>
    <text x="105" y="510" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">覆盖路由表：未指定</text>
    <rect x="105" y="565" width="286" height="48" rx="24" fill="#ccfbf1"/>
    <text x="130" y="598" fill="#115e59" font-size="23" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">能 ping6 VPS 即可</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="507" y="180" width="386" height="480" rx="22" fill="#ffffff"/>
    <rect x="507" y="180" width="386" height="78" rx="22" fill="#1d4ed8"/>
    <text x="542" y="230" fill="#ffffff" font-size="29" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">LAN：不要发 IPv6</text>
    <text x="542" y="310" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">RA 服务：已禁用</text>
    <text x="542" y="360" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">DHCPv6 服务：已禁用</text>
    <text x="542" y="410" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">NDP 代理：已禁用</text>
    <text x="542" y="460" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">IPv6 分配长度：已禁用</text>
    <text x="542" y="510" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">委派 IPv6 前缀：可取消</text>
    <rect x="542" y="565" width="290" height="48" rx="24" fill="#dbeafe"/>
    <text x="568" y="598" fill="#1e40af" font-size="23" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">终端不拿公网 IPv6</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="944" y="180" width="386" height="480" rx="22" fill="#ffffff"/>
    <rect x="944" y="180" width="386" height="78" rx="22" fill="#b45309"/>
    <text x="979" y="230" fill="#ffffff" font-size="29" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">DHCP/DNS：别砍 AAAA</text>
    <text x="979" y="310" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">过滤本地包：勾选</text>
    <text x="979" y="360" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">过滤私有地址：勾选</text>
    <text x="979" y="410" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">过滤 IPv6 AAAA：不勾选</text>
    <text x="979" y="460" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">过滤 IPv4 A：不勾选</text>
    <text x="979" y="510" fill="#0f172a" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">DNS 交给代理核心接管</text>
    <rect x="979" y="565" width="286" height="48" rx="24" fill="#ffedd5"/>
    <text x="1006" y="598" fill="#9a3412" font-size="23" font-family="Arial, 'PingFang SC', sans-serif" font-weight="700">保留 IPv6 节点解析</text>
  </g>

  <rect x="70" y="704" width="1260" height="58" rx="18" fill="#0f172a"/>
  <text x="105" y="742" fill="#f8fafc" font-size="24" font-family="Arial, 'PingFang SC', sans-serif">口诀：WAN6 拿 IPv6，LAN 不发 IPv6，DNS 不过滤 AAAA，代理核心去连接 VPS IPv6。</text>
</svg>

# v15 - OpenWrt / iStoreOS + OpenClash, domestic speed + split encrypted DNS
# Public sanitized template: fill in your own node parameters before use.
# 使用前填写 server、port、uuid、servername、public-key 和 short-id；中文占位符不能连接。
# DNS: domestic domains and DIRECT egress use domestic DoH via DIRECT.
# Foreign/unknown domains use DoH via PROXY; no plain/system DNS fallback.
# Bootstrap and node-domain resolution intentionally use domestic encrypted DNS.
# Node failure => foreign DNS fails; domestic direct services remain available.
# OpenClash must retain this DNS section, use Fake-IP + TCP/UDP interception,
# forward dnsmasq to 127.0.0.1#1053, and enable LAN DNS hijack.
# Configure router DNS interception and IPv6 settings consistently with this template.
# This YAML alone does not stop applications using arbitrary DoH endpoints.
# tun.enable=false: transparent interception is managed by OpenClash.
mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: false
  store-fake-ip: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - +.push.apple.com
  - +.googlevideo.com
tun:
  enable: false
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: false
  auto-detect-interface: true
proxies:
- name: "自建节点-1"
  type: vless
  server: "修改为你的服务器IP或域名"
  port: 443
  ip-version: ipv4
  udp: true
  uuid: "修改为你的UUID"
  flow: xtls-rprx-vision
  packet-encoding: xudp
  encryption: none
  network: tcp
  tls: true
  servername: "修改为你的Reality握手域名"
  client-fingerprint: chrome
  skip-cert-verify: false
  reality-opts:
    public-key: "修改为你的Reality公钥"
    short-id: "修改为你的Reality短ID"
- name: DNS-INTERNAL
  type: dns
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - "自建节点-1"
dns:
  enable: true
  listen: 127.0.0.1:1053
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.localdomain
  - localhost
  - localhost.ptlogin2.qq.com
  - dlg.io.mi.com
  nameserver-policy:
    +.lan,+.local,+.localdomain,localhost,+.in-addr.arpa,+.ip6.arpa:
    - rcode://success
    ? +.dns.google,+.cloudflare-dns.com,+.one.one.one.one,+.dns.quad9.net,+.dns.alidns.com,+.doh.pub,+.doh.360.cn,+.oaistatic.com,+.oaiusercontent.com,+.claudeusercontent.com,+.github.com,+.githubusercontent.com,+.githubassets.com,+.ghcr.io,+.github.io,+.githubapp.com,+.github.dev,+.githubcopilot.com,+.openai.com,+.chatgpt.com,+.anthropic.com,+.claude.ai,+.google.com,+.googleapis.com,+.googleapis.cn,+.gstatic.com,+.gvt1.com,+.gvt2.com,+.gvt3.com,+.googleusercontent.com,+.ggpht.com,+.android.com,+.xn--ngstr-lra8j.com
    : - https://1.1.1.1/dns-query#PROXY
      - https://8.8.8.8/dns-query#PROXY
    geosite:github,google,youtube,telegram:
    - https://1.1.1.1/dns-query#PROXY
    - https://8.8.8.8/dns-query#PROXY
    ? +.qq.com,+.tencent.com,+.wechat.com,+.servicewechat.com,+.gtimg.com,+.gtimg.cn,+.qpic.cn,+.qlogo.cn,+.tenpay.com,+.myqcloud.com,+.qcloud.com,+.douyin.com,+.douyincdn.com,+.douyinpic.com,+.douyinstatic.com,+.douyinliving.com,+.iesdouyin.com,+.douyinvod.com,+.douyinvideo.net,+.amemv.com,+.snssdk.com,+.byteimg.com,+.bytecdn.cn,+.ibytedtos.com,+.zijieapi.com,+.pstatp.com,+.toutiao.com,+.toutiaovod.com,+.bytedance.net,+.xiaohongshu.com,+.xhscdn.com,+.xhscdn.net,+.xhslink.com,+.xhsimg.com,+.115.com,+.115cdn.com,+.115cdn.net,+.115img.com,+.116cd.cn,+.116cd.com,+.116cd.net,+.anxia.com,+.sq.cc,+.speedtest.net,+.ooklaserver.net,+.speedtestcustom.com,+.speed.cloudflare.com,+.measurementlab.net,+.speedtest.cn,+.microsoft.com,+.msftconnecttest.com,+.msftncsi.com,+.windowsupdate.com,+.office.com,+.office.net,+.office365.com,+.live.com,+.live.net,+.outlook.com,+.microsoftonline.com,+.microsoftonline-p.com,+.sharepoint.com,+.sharepointonline.com,+.onedrive.com,+.skype.com,+.azureedge.net,+.msauth.net,+.msauthimages.net,+.msftauth.net,+.msftauthimages.net,fhnfile.oss-cn-shenzhen.aliyuncs.com
    : - https://223.5.5.5/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    geosite:alibaba,microsoft,category-games@cn,apple-cn,apple,microsoft@cn,steam@cn,cn,geolocation-cn:
    - https://223.5.5.5/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  nameserver:
  - https://1.1.1.1/dns-query#PROXY
  - https://8.8.8.8/dns-query#PROXY
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
